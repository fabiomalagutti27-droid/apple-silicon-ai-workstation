name: 🐛 Bug Report
description: Report an issue with kernel limits, llama-swap routing, or service installation
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please provide details about the problem to help diagnose and resolve it.

  - type: input
    id: system_info
    attributes:
      label: System Environment
      description: Output of `uname -a` and `sysctl hw.model hw.memsize iogpu.wired_limit_mb`
      placeholder: "Darwin 27.2.0 arm64, Mac17,16, 64GB UMA"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Problem Description
      description: Clear and concise description of what went wrong
    validations:
      required: true

  - type: textarea
    id: reproduction_steps
    attributes:
      label: Steps to Reproduce
      description: Commands executed before the error occurred
      placeholder: |
        1. make setup
        2. make kernel
        3. ...
    validations:
      required: true

  - type: textarea
    id: error_logs
    attributes:
      label: Relevant Logs / Terminal Output
      description: Paste any error messages or crash traces
      render: shell
